<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>めいしょ (Famous Places)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>めいしょ <span class="romaji">(Famous Places)</span></h1>
    </header>
    <main>
        <section>
            <img src="https://i.pinimg.com/1200x/1c/32/1f/1c321f1ec3970e87d11317f5f78566d2.jpg" alt="Kyoto" class="page-banner">
        </section>
        <section class="cards">
            <div class="card">
                <img src="https://i.pinimg.com/1200x/f9/b0/be/f9b0be410a73d127ff4ac89e987e14ec.jpg" alt="Mt. Fuji">
                <h2>ふじさん<br><span class="romaji">Fuji-san</span></h2>
                <p>日本一のやま</p>
            </div>
            <div class="card">
                <img src="https://i.pinimg.com/1200x/98/f2/de/98f2def7f848ec60466b768cd8b84fe7.jpg" alt="Kinkakuji Temple">
                <h2>きんかくじ<br><span class="romaji">Kinkakuji</span></h2>
                <p>きんいろのおてら、きょうと</p>
            </div>
            <div class="card">
                <img src="https://i.pinimg.com/1200x/1e/0b/bf/1e0bbf90534371663cac5d42f8d7e0fc.jpg" alt="Shibuya Crossing">
                <h2>しぶや<br><span class="romaji">Shibuya</span></h2>
                <p>にぎやかな とうきょうの くうかん</p>
            </div>
        </section>
    </main>
</body>
</html>
